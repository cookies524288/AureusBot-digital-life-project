# AureusBot 运行配置模板。
#
# 用法：复制成 <数据根目录>/config/aureus.toml，再按需修改。
# 不复制也能运行，所有字段都有默认值。
# 这里不放密钥：密钥只放 .env（见 .env.example）。
# 数据根目录是什么、在哪里，见 docs/14-user-data.md。

# 配置文件的格式版本。软件更新后如果配置格式变了，会靠它判断；一般不用改。
config_version = 1

# 日志级别：DEBUG / INFO / WARNING / ERROR，默认 INFO。
log_level = "INFO"

# 安全网关（设计见 docs/06-safety.md 第 12 节）。下面的值都是默认值，需要改再取消注释。
# 注意：true / false 不能写成引号或数字，数字不能加引号。
[safety]
# 每月最多使用的 token（输入加输出），按本地时间每月 1 日凌晨 4 点换月（见下面的 [time]）。
# 不写就是不限制，每次启动会警告一次。写 0 或负数会报错。
# monthly_token_limit = 5000000

# 失控拦截的总开关。关掉后每次启动会警告一次。
# runaway_guard_enabled = true
# 每个器官每分钟最多调用几次。
# max_calls_per_minute = 20
# 同一个器官连续失败几次后暂停。
# max_consecutive_failures = 5
# 暂停多少秒。
# failure_pause_seconds = 300

# 心跳（设计见 docs/10-decisions.md 的 D41）。下面的值都是默认值，需要改再取消注释。
[heartbeat]
# 没有新消息时，隔多少秒跳一拍。不能小于 1。
# tick_interval_seconds = 60
# 是否让时间推进生物模型（四种激素随时间衰减、皮质醇跟着昼夜变）。
# 关掉后它们都停在原来的值。
# advance_biomodel = true
# 它对自己状态的描述变了时，是否记进时间线（只有它自己可见）。
# broadcast_cognitive_state = true
# 关闭时最多等进行中的模型调用多少秒，等不到就取消。
# shutdown_grace_seconds = 60
# 回复时带上最近多少条对话。
# recent_message_limit = 20
# 回复用哪个器官，名字要和 models.toml 里的 [organs.名字] 一致。
# reply_organ = "replyer"
# 精力正常时，先由规划器决定回不回、说什么、多长，再由回复器写成话（两次调用）。
# 关掉后每次都合并成一次调用。精力进了节省档或更低时，本来就合并成一次。
# planning_enabled = true
# 规划用哪个器官；planning_enabled 打开时，models.toml 里必须有 [organs.这个名字]。
# plan_organ = "planner"
# 节省档时带上最近多少条对话；低电量和透支保护时带多少条。都不会超过 recent_message_limit。
# saving_message_limit = 10
# low_message_limit = 5
# 把一段回复拆成几条短消息发出（口语、短句、分条）；关掉后整段一条发出。
# split_reply_enabled = true
# 一段回复最多拆成几条。
# max_reply_messages = 4
# 一条至少多少个字，更短的句子并进相邻的一句。
# min_message_chars = 4
# 你在 identity.toml 里改了设定后，告诉它这次醒来前哪几层被改了（不给旧内容）；时间线照样记。
# identity_changes_in_prompt = true

# 身体信号（设计见 docs/04-body-signals.md、docs/10-decisions.md 的 D56、D57）。
# 精力来自每月 token 上限：每日额度 = 本月剩余额度 ÷ 本月剩余天数，
# 所以要在 [safety] 里写了 monthly_token_limit 才有意义；没写时精力记为「不限」。
[body]
# 精力信号的总开关。关掉后不再按每日额度限制调用，月度上限仍然生效。
# energy_enabled = true
# 每日额度里只留给回应用户的比例（0 到 1）。可选的调用用到 85% 就停。
# user_reserve_fraction = 0.15
# 是否把身体状态（精力、疲劳、压力、夜间）的真实数字告诉模型，让它被问起时能如实说。
# 关掉后它不知道这些，被问起时没有事实可说；上面各信号对行为的影响不变。
# state_in_prompt_enabled = true
# 档位分界，精力 = 今日剩余额度 ÷ 今日额度。要满足 overdraft_below < low_below < saving_below。
# 低于 saving_below 进节省档，低于 low_below 进低电量，低于 overdraft_below 进透支保护。
# saving_below = 0.5
# low_below = 0.2
# overdraft_below = 0.05

# 疲劳：来自最近一段时间的器官调用次数。偏高时，收到消息先等几秒，把同一个人的几条攒起来一起回。
# fatigue_enabled = true
# 看最近多少分钟的调用。
# fatigue_window_minutes = 30
# 窗口里调用满这么多次，疲劳就是 100%。
# fatigue_full_calls = 60
# 疲劳达到多少算偏高（0 到 1）。
# fatigue_high_at = 0.7
# 偏高时先等多少秒再开始回。
# fatigue_batch_seconds = 20.0

# 压力：来自最近的调用失败率和排队的消息数，取两项里较大的。偏高时发一次自检通知。
# stress_enabled = true
# 看最近多少次调用的成败。
# stress_window_calls = 20
# 排队的消息数达到这么多，积压带来的压力就是 100%。
# stress_backlog_full = 5
# 压力达到多少算偏高（0 到 1）。
# stress_high_at = 0.6

# 睡眠：夜间时段（当地时间，包含开始的钟点，不含结束的钟点；开始大于结束表示跨过午夜）。
# 夜里定时拍放慢；有新消息时照样马上醒来。关掉后也不再告诉它每次停机停了多久。
# sleep_enabled = true
# night_start_hour = 1
# night_end_hour = 7
# 夜里定时拍的间隔（秒），只会比白天慢，不会更快。
# night_tick_interval_seconds = 300.0

# 身体信号样本（设计见 docs/10-decisions.md 的 D64）：心跳每隔一段时间把当时的读数记一行，
# 观察台画曲线靠它。观察台是独立进程、只读数据库，看不到心跳的内存，所以读数要先进数据库。
# 样本的总开关。关掉后不写样本，观察台显示「没有样本」；上面各信号对行为的影响不变。
# sample_enabled = true
# 两次记样本之间隔多少秒（至少 1）。
# sample_interval_seconds = 60.0
# 样本留多少天（至少 1），启动时清掉更早的行。样本只是读数，不是经历，
# 所以不受时间线只追加的规则约束。
# sample_retention_days = 30

# 「一天」和「一个月」怎么划分（设计见 docs/10-decisions.md 的 D53）。
# 每月的 token 上限、将来每天的精力额度，都按这里的边界算。
[time]
# 时区，写 IANA 名字，比如 "Asia/Shanghai"。不写就用这台电脑设置的时区。
# 换了时区只改「哪一刻算哪个月」，账本里已经记下的时间不变。
# timezone = "Asia/Shanghai"
# 一天从当地几点开始，0 到 23。每月 1 日的这个时刻算新的一个月；
# 默认 4 点，熬夜到凌晨 3 点聊天，用的还是前一天的额度。
# day_start_hour = 4

# 快照（导入前的自动备份等，放在 data/snapshots/，设计见 docs/10-decisions.md 的 D46）。
[snapshots]
# 所有快照加起来最多占多少 MB。每次启动时超过就从最旧的开始删，最新的一份永远保留。
# 默认值还没有实测过，嫌占地方或想多留几份，就改这里。至少 1。
# max_total_megabytes = 1024

# 网页通道（设计见 docs/10-decisions.md 的 D63、D53 第 5 条）。下面的值都是默认值，需要改再取消注释。
# 第一次登录用默认口令 admin，登录后必须先改口令；口令还是默认的时候，只有本机能登录。
[web]
# 网页通道的总开关。关掉后 aureus chat 不启动网页服务。
# enabled = true
# 是否允许局域网里的其他设备访问（比如手机）。默认只有本机能打开。
# 注意：局域网里是不加密的 HTTP，同一 Wi-Fi 下有人抓包就能看到聊天内容。
# 口令还是默认的 admin 时，打开它会让网页服务拒绝启动。
# allow_remote = false
# 监听端口，1024 到 65535。端口被别的程序占用了就换一个。
# port = 8765
# 登录状态有效几天，从最后一次活动算起，每次使用都会续期。每台设备各自计时。
# session_days = 7
# 登录失败限流（按来源 IP）：窗口内失败这么多次，就在锁定期内拒绝这个 IP 再登录。
# login_max_failures = 5
# 统计失败次数的窗口（秒）。
# login_window_seconds = 300
# 锁定多久（秒）。
# login_lockout_seconds = 900
