# AureusBot 运行配置模板。
#
# 用法：复制成 <数据根目录>/config/aureus.toml，再按需修改。
# 不复制也能运行，所有字段都有程序默认值。只取消注释需要覆盖的字段。
# 这里不放密钥：密钥只放 .env（见 .env.example）。
# 数据根目录是什么、在哪里，见 docs/14-user-data.md。

# 配置文件的格式版本。软件更新后如果配置格式变了，会靠它判断；一般不用改。
config_version = 1

# 日志级别：DEBUG / INFO / WARNING / ERROR，默认 INFO。
# log_level = "INFO"

# 安全网关（设计见 docs/06-safety.md 第 12 节）。下面的值都是默认值，需要改再取消注释。
# 注意：true / false 不能写成引号或数字，数字不能加引号。
[safety]
# 每月最多使用的 token（输入加输出），按本地时间每月 1 日凌晨 4 点换月（见下面的 [time]）。
# 不写就是不限制，每次启动会警告一次。写 0 或负数会报错。
# monthly_token_limit = 5000000

# 失控拦截的总开关。关掉后每次启动会警告一次。
# runaway_guard_enabled = true
# 每个器官每分钟最多调用几次。
# max_calls_per_minute = 20
# 同一个器官连续失败几次后暂停。
# max_consecutive_failures = 5
# 暂停多少秒。
# failure_pause_seconds = 300

# 心跳（设计见 docs/10-decisions.md 的 D41）。下面的值都是默认值，需要改再取消注释。
[heartbeat]
# 没有新消息时，隔多少秒跳一拍。不能小于 1。
# tick_interval_seconds = 60
# 它对自己状态的描述变了时，是否记进时间线（只有它自己可见）。
# broadcast_cognitive_state = true
# 关闭时最多等进行中的模型调用多少秒，等不到就取消。
# shutdown_grace_seconds = 60
# 回复时带上最近多少条对话。
# recent_message_limit = 20
# 各精力档位固定先调用 [organs.planner]，需要回复时使用 [organs.replyer]；在 models.toml 中配置它们的模型。
# 自主翻阅和规划器调整特别关心的总开关。
# inbox_attention_enabled = true
# 每次自主翻阅在所有选中会话合计读取的条数，范围 1–200。
# inbox_read_limit = 35
# 开启后合并同会话来信，规划器用流式请求。思考期间新来信可重开本轮规划。
# inbox_debounce_enabled = true
# inbox_debounce_seconds = 4.0
# inbox_debounce_max_restarts = 4
# QQ 表情收集与回复选择。配置 [organs.emoji] 可使用专门的文字模型。
# qq_emoji_collection_enabled = true
# qq_emoji_selection_enabled = true
# 每 10 分钟核对原件，只影响发送候选；不修改登记或原件。
# qq_emoji_maintenance_enabled = true
# 可选视觉选择改用 vlm 查看候选拼图；关闭时保留原来的文字或语义选择。
# qq_emoji_visual_enabled = false
# 可选语义匹配优先调用文本向量模型，无有效匹配时继续使用文字模型。
# qq_emoji_semantic_enabled = false
# qq_emoji_semantic_refresh_seconds = 300.0
# qq_emoji_semantic_threshold = 0.3
# 节省档时带上最近多少条对话；低电量和透支保护时带多少条。都不会超过 recent_message_limit。
# saving_message_limit = 10
# low_message_limit = 5
# 分条开启后，已通过再审的回复交给 models.toml 中的 [organs.fast_model] 建议切点。
# 快速模型只建议在哪里切。缺少可用建议时按文字分段。关掉分条后一条发完。
# split_reply_enabled = true
# 自动分段时最多拆成几条。回复器指定的强制切点仍会保留。
# max_reply_messages = 4
# 自动分段时，切点两侧各至少保留多少个字。
# min_message_chars = 4
# 首段无需等待打字。开启后，同一回复的后续段按打字时长和随机延迟依次发出。
# 关掉后跳过打字等待，仍按会话顺序发送。
# typing_delay_enabled = true
# 后续段按其中的汉字与其他字符分别累加打字秒数。
# typing_han_seconds = 0.9
# typing_other_seconds = 0.38
# 每个后续段额外加上这个范围内的均匀随机秒数。
# typing_jitter_min_seconds = 0.3
# typing_jitter_max_seconds = 1.7
# 你在 identity.toml 里改了设定后，告诉它这次醒来前哪几层被改了（不给旧内容）；时间线照样记。
# identity_changes_in_prompt = true
# 扮演模式（实验对照组，设计见 docs/10-decisions.md 的 D65）：打开后关掉所有身体信号机制
# （精力、疲劳、压力、睡眠、状态摘要、样本），只在提示词里写一段「你有精力和心情」让模型自己演。
# 月度上限、失控拦截、急停等安全检查照常生效。只用来和真实信号的做法做对比，平时不要开。
# roleplay_mode = false
# 工作记忆达到容量时整理最早的（容量减保留条数）条，保留近期焦点。
# working_memory_enabled = true
# working_memory_capacity = 80
# working_memory_retain = 25

# 身体信号（设计见 docs/04-body-signals.md、docs/10-decisions.md 的 D56、D57）。
# 精力来自每月 token 上限：每日额度 = 本月剩余额度 ÷ 本月剩余天数，
# 所以要在 [safety] 里写了 monthly_token_limit 才有意义；没写时精力记为「不限」。
[body]
# 精力信号的总开关。关掉后不再按每日额度限制调用，月度上限仍然生效。
# energy_enabled = true
# 每日额度里只留给回应用户的比例（0 到 1）。可选的调用用到 85% 就停。
# user_reserve_fraction = 0.15
# 是否把身体状态（精力、疲劳、压力、夜间）的真实数字告诉模型，让它被问起时能如实说。
# 关掉后它不知道这些，被问起时没有事实可说；上面各信号对行为的影响不变。
# state_in_prompt_enabled = true
# 档位分界，精力 = 今日剩余额度 ÷ 今日额度。要满足 overdraft_below < low_below < saving_below。
# 低于 saving_below 进节省档，低于 low_below 进低电量，低于 overdraft_below 进透支保护。
# saving_below = 0.5
# low_below = 0.2
# overdraft_below = 0.05

# 疲劳：来自最近一段时间的器官调用次数。偏高时，收到消息先等几秒，把同一个人的几条攒起来一起回。
# fatigue_enabled = true
# 看最近多少分钟的调用。
# fatigue_window_minutes = 30
# 窗口里调用满这么多次，疲劳就是 100%。
# fatigue_full_calls = 60
# 疲劳达到多少算偏高（0 到 1）。
# fatigue_high_at = 0.7
# 偏高时先等多少秒再开始回。
# fatigue_batch_seconds = 20.0

# 压力：来自最近的调用失败率和排队的消息数，取两项里较大的。偏高时发一次自检通知。
# stress_enabled = true
# 看最近多少次调用的成败。
# stress_window_calls = 20
# 排队的消息数达到这么多，积压带来的压力就是 100%。
# stress_backlog_full = 5
# 压力达到多少算偏高（0 到 1）。
# stress_high_at = 0.6
# 压力偏高时，回复做法比精力档位低一档（换便宜模型、合并调用、回复变短）；
# 回落到偏高线的一半以下才恢复。关掉后压力只自检，不降档。
# stress_lowers_tier = true

# 社交需求（D76）：距离上次和你好好聊过越久，越想聊；真正主动开口还要打开 [initiative]。
# social_need_enabled = true
# 上涨曲线的时间常数（小时），必须大于 0。
# social_need_time_constant_hours = 12.0
# 达到多少算偏高（大于 0、不超过 1）。
# social_need_high_at = 0.7

# 睡眠：夜间时段（当地时间，包含开始的钟点，不含结束的钟点；开始大于结束表示跨过午夜）。
# 夜里定时拍放慢；有新消息时照样马上醒来。关掉后也不再告诉它每次停机停了多久。
# sleep_enabled = true
# night_start_hour = 1
# night_end_hour = 7
# 夜里定时拍的间隔（秒），只会比白天慢，不会更快。
# night_tick_interval_seconds = 300.0

# 身体信号样本（设计见 docs/10-decisions.md 的 D64）：心跳每隔一段时间把当时的读数记一行，
# 观察台画曲线靠它。观察台是独立进程、只读数据库，看不到心跳的内存，所以读数要先进数据库。
# 样本的总开关。关掉后不写样本，观察台显示「没有样本」；上面各信号对行为的影响不变。
# sample_enabled = true
# 两次记样本之间隔多少秒（至少 1）。
# sample_interval_seconds = 60.0
# 样本留多少天（至少 1），启动时清掉更早的行。样本只是读数，不是经历，
# 所以不受时间线只追加的规则约束。
# sample_retention_days = 30

# 「一天」和「一个月」怎么划分（设计见 docs/10-decisions.md 的 D53）。
# 每月的 token 上限、将来每天的精力额度，都按这里的边界算。
[time]
# 时区，写 IANA 名字，比如 "Asia/Shanghai"。不写就用这台电脑设置的时区。
# 换了时区只改「哪一刻算哪个月」，账本里已经记下的时间不变。
# timezone = "Asia/Shanghai"
# 一天从当地几点开始，0 到 23。每月 1 日的这个时刻算新的一个月；
# 默认 4 点，熬夜到凌晨 3 点聊天，用的还是前一天的额度。
# day_start_hour = 4

# 快照（导入前的自动备份等，放在 data/snapshots/，设计见 docs/10-decisions.md 的 D46）。
[snapshots]
# 所有快照加起来最多占多少 MB。每次启动时超过就从最旧的开始删，最新的一份永远保留。
# 默认值还没有实测过，嫌占地方或想多留几份，就改这里。至少 1。
# max_total_megabytes = 1024

# 网页通道（设计见 docs/10-decisions.md 的 D63、D53 第 5 条）。下面的值都是默认值，需要改再取消注释。
# 第一次登录用默认密码 admin，登录后必须先改密码；密码还是默认的时候，只有本机能登录。
[qq]
# QQ 通道默认关闭。使用 SnowLuma 的正向 WebSocket 端点。
# enabled = false
# endpoint = ""
# account_id = ""  # SnowLuma 登录的机器人 QQ 号，保留引号。
# token_key = "AUREUS_KEY_QQ_ONEBOT"  # 通过 aureus keys set 写入令牌。
# action_timeout_seconds = 10.0
# reconnect_seconds = 5.0

[web]
# 网页通道的总开关。关掉后 aureus chat 不启动网页服务。
# enabled = true
# 是否允许局域网里的其他设备访问（比如手机）。默认只有本机能打开。
# 注意：局域网里是不加密的 HTTP，同一 Wi-Fi 下有人抓包就能看到聊天内容。
# 密码还是默认的 admin 时，打开它会让网页服务拒绝启动。
# allow_remote = false
# 监听端口，1024 到 65535。端口被别的程序占用了就换一个。
# port = 28976
# 登录状态有效几天，从最后一次活动算起，每次使用都会续期。每台设备各自计时。
# session_days = 7
# 登录失败限流（按来源 IP）：窗口内失败这么多次，就在锁定期内拒绝这个 IP 再登录。
# login_max_failures = 7
# 统计失败次数的窗口（秒）。
# login_window_seconds = 300
# 锁定多久（秒）。
# login_lockout_seconds = 30
# 只在有授权的 QQ 会话中从 QQ 官方图源读取头像；关闭后使用本地像素人头。
# qq_avatars_enabled = true

# 反馈（设计见 docs/10-decisions.md 的 D67）：做事前记下预期，做完记结果，
# 用真实成功率算「自信」；它说「有几成把握」时，数字来自这里。下面的值都是默认值。
[feedback]
# 反馈的总开关。关掉后不记预期和结果，其余行为不受影响。
# enabled = true
# 自信取每个类别最近多少次有结果的行动，结果未知的不算。至少 1。
# window_size = 50
# 有结果的次数少于这么多时，自信和先验 0.5 按样本数混合，并标「样本不足」。
# 至少 1，不能大于 window_size。
# min_samples = 10

# 判断（设计见 docs/10-decisions.md 的 D68）：回复前先让判断器官看一眼这条消息，
# 报告别人的情绪，和有没有冲着它来的冒犯、夸奖、拒绝。
# 判断结果会触发激素（怒气、愉悦、低落），所以默认开启。
[judge]
# 判断的总开关。打开后每次回复前会多调用一次便宜的模型；没配 judge 器官时自动跳过。
# 精力在低电量和透支保护档、或可选额度用完时不调用。
# enabled = true
# 判断前附上允许给当前会话的自身读数；关闭不影响判断及下游调节。
# state_context_enabled = true
# models.toml 里的器官名；没配这个器官时跳过判断，只记一次日志。
# organ = "judge"
# 判断最多等多少秒，超时就不要判断结果，回复照常。必须大于 0。
# timeout_seconds = 10.0
# 除了这次要回复的消息，再带之前几条对话。0 表示只看这一条。
# context_messages = 5

# 激素（设计见 docs/10-decisions.md 的 D69）：怒气、愉悦、低落、惊讶四种几分钟尺度的短期情绪。
# 由判断器官报告的事和反馈的结果触发，按半衰期消退；浓度由代码算，不由大模型决定。
# 下面的值都是默认值，没有实测依据，跑起来之后按表现调整。
[hormones]
# 激素的总开关。关掉后不触发、不写进状态摘要、不影响行为。
# enabled = true
# 四种激素各自的开关。
# anger_enabled = true
# joy_enabled = true
# hurt_enabled = true
# surprise_enabled = true
# 半衰期（秒）：浓度降到一半要多久。必须大于 0。
# anger_half_life_seconds = 600.0
# joy_half_life_seconds = 900.0
# hurt_half_life_seconds = 1800.0
# surprise_half_life_seconds = 180.0
# 判断器官报的事：上涨量 = 基础量 × 强度 × 把握，单次不超过上限。都在 0 到 1 之间。
# base_amount = 0.5
# max_single_rise = 0.4
# 把握低于这个值的判断不算。
# min_confidence = 0.3
# 同一个人在窗口内反复触发，第 n 次乘以这个系数的 n − 1 次方，刷屏刷不出情绪。
# repeat_decay = 0.6
# repeat_window_seconds = 600.0
# 对某个人的怒气达到 retaliate_at 就允许回击，回落到 calm_below 以下算一场冲突结束，
# 达到 cold_shoulder_at 时规划器可以选择不回。要满足 calm_below < retaliate_at < cold_shoulder_at。
# calm_below = 0.2
# retaliate_at = 0.5
# cold_shoulder_at = 0.8
# 同一场冲突里最多回击几次，到了就改成冷静回应。
# max_retaliations = 3
# 低落达到这个值，回复的长度上限降一档。
# hurt_shorten_at = 0.5
# 惊讶达到这个值，这一拍不等疲劳攒消息。
# surprise_at = 0.5
# 反馈里结果和预期把握差这么多，才算「差得很多」，触发惊讶。
# surprise_gap = 0.5

# 人际（好感的设计见 docs/10-decisions.md 的 D71）：好感满分 100，越高越难涨、越低越难跌，
# 永远到不了 0 和 100。下面的值都是默认值，没有实测依据，跑起来之后按表现调整。
[people]
# 好感的开关。关掉后不记变化、不写进上下文。
# affinity_enabled = true
# 迁入的人物资料是否作为正常回复的内部参考（3.3）
# history_in_reply_enabled = true
# profile_alias_maintenance_in_reply_enabled = true  # 关掉只影响回复读取本机人工别名
# 初值：用户和其他人。只在第一次用到时采用，之后改这里不会改已有的好感。要在 0 和 100 之间（不含两端）。
# user_initial_affinity = 80.0
# stranger_affinity = 30.0
# 判断器官报的事：变化量 = 基础量 × 强度 × 把握，再按好感高低打折。
# praise_amount = 3.0
# offense_amount = 4.0
# rejection_amount = 2.0
# 每天第一次有判断过的对话时，按互动量涨这么多。
# interaction_amount = 0.5
# 每个人每天涨、跌各自的上限。
# daily_rise_cap = 5.0
# daily_fall_cap = 8.0

# 同理心（设计见 docs/10-decisions.md 的 D72）：判断器官读出别人（人或动物）的情绪，
# 它自己同种情绪也上涨，对越有好感的人共情越强。单次上限、刷屏递减等沿用 [hormones] 的。
[empathy]
# 共情的开关。关掉后判断器官照常调用，只是不产生共情。
# enabled = true
# 基础量：上涨量 = 基础量 × 强度 × 把握 × 好感系数。
# base_amount = 0.3
# 好感系数 = 下限 + (1 - 下限) × 好感 / 100。下限在 0 到 1 之间。
# affinity_floor = 0.2

# 心情（设计见 docs/10-decisions.md 的 D73）：几小时到几天的基调，−1 到 1，基线 0。
# 由激素（愉悦加，怒气和低落减）和反馈结果（成功加，失败减）累积，再减去此刻的压力。
# 下面的值都是默认值，没有实测依据，跑起来之后按表现调整。
[mood]
# 心情的开关。关掉后不算心情、不写进上下文、不会变谨慎。
# enabled = true
# 每件事的影响按这个半衰期回落（秒），默认 6 小时。
# half_life_seconds = 21600.0
# 激素触发的权重：贡献 = 权重 × 上涨量。
# hormone_weight = 0.5
# 反馈结果：成功加多少、失败减多少。
# success_amount = 0.05
# failure_amount = 0.1
# 每件事单次贡献的上限。
# max_single_change = 0.2
# 此刻压力往下拉多少（乘以压力，0 到 1）。
# stress_weight = 0.3
# 心情低于 cautious_below 变谨慎，回到 recover_above 以上才恢复。前者要小于后者。
# cautious_below = -0.3
# recover_above = -0.15

# 日程（设计见 docs/10-decisions.md 的 D74）：它答应过的事。规划器回复时顺带提出，代码校验后记下；
# 到期后下次和那个人说话时提起；做完、放弃（要说原因）、过期都记进反馈。
# 自己去推进日程、主动联系对方是另一个开关（2.8 的 [initiative]），默认关。下面的值都是默认值。
[agenda]
# 日程的开关。关掉后不记承诺、不提醒、不记兑现。
# enabled = true
# 每个人名下未完成的条目最多几条。
# max_open_per_person = 20
# 到期时间最远能定在几天后。
# max_due_days = 90
# 到期后再过几天还没交代，就算过期。
# expire_grace_days = 3.0
# 回复时上下文里最多列几条未完成的条目。
# context_items = 5

# 主动联系用户（D76）：社交需求偏高或答应的事到期时，先由代码把关，再让规划器决定。
# 默认关闭。下面的值都是默认值。
[initiative]
# 主动联系的开关；扮演模式下始终关闭。
# enabled = false
# 每天最多主动发出几次，谨慎时减半、至少一次。
# max_per_day = 2
# 两次考虑至少隔几小时，每连续一次没回应翻倍，到上限为止。
# min_interval_hours = 3.0
# max_interval_hours = 48.0
# 发出后等回应几小时。
# answer_window_hours = 6.0
# 连续几次没回应后停止，直到你先开口。
# give_up_after = 3

[interests]
# 兴趣开关及自行改动限额（D79）；关着时仍同步用户的起始兴趣。
# enabled = false
# max_active = 10
# max_changes_per_day = 3

[exploration]
# 小探索默认关闭；启用前须开启 interests。
# enabled = false
# organ = "summarizer"
# search_provider = "none"
# 使用 SearXNG 时将 search_provider 改为 "searxng"，并填写启用了 JSON 的搜索端点，例如 http://127.0.0.1:8080/search。
# search_endpoint = ""
# max_per_day = 3
# min_interval_hours = 4.0
# max_results = 5
# fetch_timeout_seconds = 10.0
# max_page_bytes = 1048576
# max_page_chars = 6000
# share_within_days = 3.0

# 记忆简易版（D80）：从时间线增量建全文索引，规划器按需提供关键词。
[memory]
# 关掉后不建索引、不查记忆；扮演模式下也可开启。
# enabled = true
# 只关召回仍继续建索引。
# recall_enabled = true
# heuristic_recall_enabled = false  # 在规划前按本轮回忆提示词检索
# graph_recall_enabled = true  # 将已发布迁移图中的有向关系作为内部回复材料
# recall_feedback_enabled = true    # 人工评价已投递回复的召回依据；不参与排序
# removal_operations_enabled = true # 记录本地文字记忆的移除和恢复；不影响批量维护
# 一次最多给回复器几条，1～20。
# max_results = 5
# 每拍最多处理几条新的时间线记录，1～5000。
# index_batch = 200
# 夜间空闲时整理派生候选，保留时间线与迁入原件。
# consolidation_enabled = false
# 累积到这一条数后，每批整理同样的条数，1～500。
# consolidation_batch = 64
# 派生候选的权重半衰期，以天计。
# consolidation_half_life_days = 30.0
# 允许总结器官从明确的用户私聊中提取带证据的事实和偏好候选。
# consolidation_extract_enabled = false

# 每日日记（D80）：失败当天不再试，不补写；与记忆开关相互独立。
[language]
recall_enabled = true
# 可选调用，启用后配置的学习器官须可用。
learning_enabled = false
organ = "summarizer"
reference_chars = 700
# D101：只使用 text_embedding 中未标价的本机回环 OpenAI 兼容路线。
use_vector_expression = false
# expression_selector_organ = "fast_model"  # 可选；不填则直接用排好的候选。

[diary]
# enabled = true
# 没注册这个器官时跳过，启动时只记一次日志。
# organ = "summarizer"
# 当地几点以后写，0～23；凌晨 4 点前仍属于前一天。
# write_after_hour = 22
# 材料超长时保留最新整条记录，1000～50000。
# max_input_chars = 6000
# 日记正文上限，100～10000。
# max_chars = 1500

[persona_growth]
# 人设成长（D81）：日记后回顾和用户的经历，小幅改三层之一；会改自己，默认关闭。
# enabled = false
# 没注册这个器官时跳过，只记一次日志。
# organ = "summarizer"
# 材料上限，1000～50000。
# max_input_chars = 6000
# 同一层两次自己改至少隔几天，1～365。
# layer_cooldown_days = 7
# 新旧文字相似度下限，0.3～0.99。
# min_similarity = 0.7
# 原来是空的层，新内容最多几个字，20～1000。
# max_chars_from_empty = 200
# 改完后一层最多几个字（用户原文更长时以原文为准），100～5000。
# max_layer_chars = 1000
