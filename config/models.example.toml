# AureusBot 模型配置模板。
#
# 用法：复制成 <数据根目录>/config/models.toml，再按注释修改。
# 这里不放密钥：密钥用 keys 命令存进加密的密钥库（设计见 docs/15-model-management.md 第 7 节），
# 这里只写它的名字。
# 设计见 docs/15-model-management.md。
# 下面所有名字、地址、价格都只是示例，请换成你自己用的服务商和模型。

# 配置文件的格式版本。一般不用改。
config_version = 1

# ---------------------------------------------------------------------
# 第一层：服务商（去哪里调用、怎么认证）。想用几家就写几段 [[providers]]。
# ---------------------------------------------------------------------
[[providers]]
# 自己起的名字，下面的模型按它引用。
name = "example"
# 协议：openai / openai_responses / anthropic / gemini。
protocol = "openai"
# 接口地址。不写就用该协议的官方地址。
base_url = "https://api.example.com/v1"
# 密钥的名字（不是密钥本身），必须以 AUREUS_KEY_ 开头，
# 密钥本身用 keys 命令录入。不需要密钥的服务商（比如本地模型）不写这一行。
api_key_env = "AUREUS_KEY_EXAMPLE"
# 一次请求最多等多少秒；超时、断线、限流这类临时性的失败，最多再重试几次（每次请求单独记账）。
timeout_seconds = 60
max_retry = 2

# ---------------------------------------------------------------------
# 第二层：模型（服务商提供的某个具体模型）。
# 价格单位：元 / 百万 token，可选。预算按 token 计，不靠价格运作；填了价格只用来
# 显示估算费用，不写就是“费用未知”（不是免费）。
# ---------------------------------------------------------------------
[[models]]
name = "example-chat"            # 自己起的名字，器官按它引用
identifier = "example-model-id"  # 服务商给的模型标识
provider = "example"             # 上面服务商的名字
kind = "llm"                     # 目前只有 llm 会被调用
price_in = 1.0                   # 输入价格
price_out = 2.0                  # 输出价格
price_cache_in = 0.1             # 命中缓存的输入价格；不写就按 price_in 算
# temperature = 0.7              # 不写就用服务商的默认值
# max_tokens = 1024              # 单次回复的 token 上限

# ---------------------------------------------------------------------
# 第三层：器官（每个器官按顺序用哪些模型）。
# 排在前面的先用；它失败了（超时、限流、密钥缺失……）才顺延到下一个。
# 写在器官上的 temperature、max_tokens 优先于模型自己的。
# ---------------------------------------------------------------------
[organs.planner]
models = ["example-chat"]

[organs.replyer]
models = ["example-chat"]
